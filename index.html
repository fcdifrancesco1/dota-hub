<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DotaHub Brasil - Portal Competitivo de Dota 2</title>
    <meta name="description" content="Acompanhe a cena profissional de Dota 2 em tempo real: partidas ao vivo, agenda, campeonatos, estatísticas, meta de heróis e bolão de palpites." />
    <meta name="theme-color" content="#F7EFE4" />

    <!-- Aplica o tema salvo antes da primeira pintura (evita piscar o tema errado) -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('dotahub-theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0C0E14' : '#F7EFE4');
      })();
    </script>

    <!-- Open Graph / SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DotaHub Brasil - Portal Competitivo de Dota 2" />
    <meta property="og:description" content="Partidas ao vivo, agenda oficial de Majors e TI, telemetria GOTV, histórico de séries e bolão de palpites." />
    <meta property="og:image" content="/aegis.png" />

    <!-- PWA Manifest & Favicon -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/aegis.png" />
    <link rel="apple-touch-icon" href="/aegis.png" />

    <!-- Fontes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-canvas text-gray-200 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
